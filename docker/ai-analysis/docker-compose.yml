services:
  jupyter-ai:
    image: tensorflow/tensorflow:latest-gpu-jupyter
    container_name: jupyter-ai
    ports:
      - "8888:8888"
    volumes:
      # Pythonノートブックおよび抽出データセットの保存先
      - /mnt/data/ai_analysis/notebooks:/tf/notebooks
      # 各種ハニーポット・IDSの生ログを読み取り専用(ro)でマウント
      - /mnt/data/web-honeypot/suricata/logs:/mnt/suricata_logs:ro
      - /mnt/data/ids_honeypot/cowrie/log:/mnt/cowrie_logs:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped