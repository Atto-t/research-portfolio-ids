version: '3.8'

services:
  jupyterlab:
    image: tensorflow/tensorflow:latest-gpu-jupyter
    container_name: jupyter-ai-analytics
    ports:
      - "8888:8888"
    volumes:
      # /mnt/data に蓄積されたSuricataのログを読み取り専用でアタッチ
      - /mnt/data/suricata/log:/tf/logs:ro
      - /mnt/data/notebooks:/tf/notebooks
    # MOK登録済みのNVIDIAドライバ(GTX 1050 Ti)をコンテナへパススルー
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # TensorFlowのCUDAライブラリ欠落バグに対する起動時パッチ
    command: >
      bash -c "pip install 'tensorflow[and-cuda]' && 
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root"
    restart: unless-stopped