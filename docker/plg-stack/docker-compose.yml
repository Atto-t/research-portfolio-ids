services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - /mnt/data/monitoring/config/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - /mnt/data/monitoring/data/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - monitor-net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /mnt/data/monitoring/config/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /mnt/data/ids_honeypot/cowrie/log:/var/log/cowrie:ro
      - /mnt/data/web-honeypot/suricata/logs:/mnt/data/web-honeypot/suricata/logs:ro
      - /mnt/data/monitoring/config/geoip.mmdb:/etc/promtail/geoip.mmdb:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - monitor-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - /mnt/data/monitoring/data/grafana:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - monitor-net

networks:
  monitor-net:
    driver: bridge