version: '3.8'

services:
  # 1. 踏み台化を完全に防ぐダミーWebサーバー
  dummy-nginx:
    image: nginx:alpine
    container_name: dummy-nginx
    ports:
      # MAP-E環境で開放可能なポート（TCP 8080等）へマッピング
      - "<MAP-E_ASSIGNED_HTTP_PORT>:80"
    # マルウェア等の書き込みをOSレベルで物理ブロック
    read_only: true
    restart: always

  # 2. 攻撃パケットをJSONで記録するIDS
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      # 1TB HDD (/mnt/data) へのログ出力マウント
      - /mnt/data/suricata/log:/var/log/suricata
    command: -i enp2s0
    restart: always