services:
  # ① ダミーWebサーバー（標的）
  nginx-honeypot:
    image: nginx:alpine
    container_name: web-honeypot-nginx
    ports:
      - "8080:80"
    # ファイルシステムの完全保護（Read-Only化）
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid
      - /var/run:rw,noexec,nosuid
      - /tmp:rw,noexec,nosuid
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    # 権限の完全剥奪と最小限のホワイトリスト許可
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: always

  # ② IDS（侵入検知システム - Suricata）
  suricata-ids:
    image: jasonish/suricata:latest
    container_name: web-honeypot-suricata
    # Nginxコンテナのネットワーク名前空間を直接監視するサイドカーパターン
    network_mode: "service:nginx-honeypot"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./suricata/logs:/var/log/suricata
      - ./suricata/rules:/var/lib/suricata/rules
    # Nginxの仮想インターフェース(eth0)をキャプチャ
    command: -i eth0
    restart: always